  <script>
    // TEMP: Figma capture mode — force scroll-reveals in and disable section zoom
    if (location.hash.includes('figmacapture')) {
      window.IntersectionObserver = class {
        constructor(cb) { this.cb = cb }
        observe(el) { this.cb([{ isIntersecting: true, intersectionRatio: 1, target: el }], this) }
        unobserve() {}
        disconnect() {}
        takeRecords() { return [] }
      }
      const realMM = window.matchMedia.bind(window)
      window.matchMedia = (q) => q.includes('prefers-reduced-motion')
        ? { matches: true, media: q, onchange: null, addEventListener() {}, removeEventListener() {}, addListener() {}, removeListener() {}, dispatchEvent() { return false } }
        : realMM(q)
      const style = document.createElement('style')
      style.textContent = '*, *::before, *::after { transition: none !important; animation-duration: 0s !important; }'
      document.addEventListener('DOMContentLoaded', () => document.head.appendChild(style))
    }
  </script>
