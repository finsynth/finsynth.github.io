<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1180" preserveAspectRatio="none">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>
  <!-- the blue halo the card floats on -->
  <rect x="72" y="40" width="976" height="1100" rx="48" fill="#2843B8" opacity="0.45" filter="url(#glow)"/>
  <rect x="96" y="64" width="928" height="1052" rx="30" fill="#2843B8"/>
  <!-- the card itself. The gradient mosaic of blue cells that used to be
       clipped inside it was dropped on request: it tinted the top-left corner
       of every visual on the pane, and the drawn SVGs read better on plain
       white. x4e-stage-mosaic.svg keeps that version if it is ever wanted. -->
  <rect x="106" y="74" width="908" height="1032" rx="22" fill="#fff"/>
</svg>
