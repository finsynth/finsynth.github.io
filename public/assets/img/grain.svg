<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <!-- a film-grain tile. stitchTiles="stitch" makes the turbulence meet itself
       at the tile edges, so repeating it across a background leaves no seam.
       Desaturated to pure luminance noise — whatever it is blended over keeps
       its own hue and only picks up the tooth. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="320" height="320" filter="url(#grain)" opacity="0.85"/>
</svg>
